name: Build & Publish Docker Image

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Next.js Build & /rws Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: web
        run: npm run typecheck

      - name: Check custom-server syntax
        working-directory: web
        run: node --check custom-server.mjs

      - name: Run production Next.js build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Smoke test custom-server routes & /rws endpoints
        working-directory: web
        run: |
          PORT=3459 HOSTNAME=127.0.0.1 ENABLE_TUNNEL=false PUBLIC_SHARE_URL=https://ci.trycloudflare.com node custom-server.mjs &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3459/zh >/dev/null; then
              break
            fi
            sleep 0.5
          done
          for p in /zh /en /zh/sundome /zh/sundome/remote /zh/sundome/remote/list /zh/sundome/c /en/sundome/c /zh/sundome/p /en/sundome/p /rws/new /rws/lobby /api/rgate/public-url; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:3459${p}")
            echo "${p} -> HTTP ${code}"
            test "$code" = "200"
          done

  docker:
    name: Build & Push to GHCR
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=dev-sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/arm64,linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
