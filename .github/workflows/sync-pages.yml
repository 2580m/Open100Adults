name: Sync GitHub Pages Branch

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "scripts/build-pages.mjs"
      - ".github/workflows/sync-pages.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-pages:
    name: Build Static Site & Sync pages Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static Pages bundle
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: node scripts/build-pages.mjs

      - name: Push static build to pages branch
        run: |
          rm -rf /tmp/gh-pages-stage
          mkdir -p /tmp/gh-pages-stage
          cp -a out-pages/. /tmp/gh-pages-stage/
          cd /tmp/gh-pages-stage
          git init -b pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync static GitHub Pages from ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin pages
