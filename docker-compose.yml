services:
  open100adults:
    image: ghcr.io/2580m/open100adults:latest
    build: .
    container_name: open100adults
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      # Built-in Cloudflare Tunnel is enabled by default so local 127.0.0.1:3000
      # can generate a public remote-play link. Set to "false" to disable.
      - ENABLE_TUNNEL=${ENABLE_TUNNEL:-true}
      # Optional: use your own fixed domain or Named Tunnel token
      # - PUBLIC_SHARE_URL=https://play.yourdomain.com
      # - CLOUDFLARED_TOKEN=your-tunnel-token
